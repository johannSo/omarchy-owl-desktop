name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, as Omarchy is: qmllint needs Quickshell's own QML types.
    container: archlinux:latest
    steps:
      # Omarchy's package repository ahead of Arch's, as Omarchy has it: its
      # Quickshell is the one Omarchy runs, and Arch's has older QML types.
      # Its packages are signed with Omarchy's key, taken by fingerprint.
      - name: Packages
        run: |
          key=40DFB630FF42BCFFB047046CF0134EE680CAC571
          pacman-key --init
          pacman-key --recv-keys "$key" --keyserver hkps://keyserver.ubuntu.com
          pacman-key --lsign-key "$key"
          sed -i 's|^\[core\]$|[omarchy]\nServer = https://pkgs.omarchy.org/stable/$arch\n\n[core]|' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git nodejs quickshell qt6-imageformats shellcheck curl jq perl inotify-tools
          pacman -Q quickshell

      - uses: actions/checkout@v4

      - name: Layout and store tests
        run: |
          node test/layout.test.mjs
          node test/store.test.mjs

      # Any warning fails, but two: var in a block (style), and Quickshell's
      # PanelWindow, which qmllint takes for the uncreatable interface in
      # Quickshell instead of the window Quickshell.Wayland provides.
      # Its text output leaves some out, so on failure this prints the report.
      - name: qmllint
        run: |
          /usr/lib/qt6/bin/qmllint --max-warnings 0 --json lint.json \
            --block-scope-var-declaration disable --uncreatable-type disable *.qml || {
            jq -r '.files[] | (.filename | split("/") | last) as $f | .warnings[]
              | select(.id != "block-scope-var-declaration" and .id != "uncreatable-type")
              | "\($f):\(.line):\(.column) \(.type) [\(.id)] \(.message | split("\n")[0])"' lint.json
            exit 1
          }

      - name: shellcheck
        run: shellcheck --severity=warning bin/owl-desktop test/plugin.test.sh

      # The manifest and the folder as the shell and the marketplace take
      # them, and the command with no shell running. Not as root: the checkout
      # is root's here, and the test wants a home of its own.
      - name: Plugin
        run: |
          useradd -m tester
          cp -r . /home/tester/repo
          chown -R tester: /home/tester/repo
          runuser -u tester -- env HOME=/home/tester bash /home/tester/repo/test/plugin.test.sh
